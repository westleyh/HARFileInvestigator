  <rect x="34" y="479" width="1032" height="35" fill="#fff"/><text x="49" y="502" fill="#1d6399" font-family="Segoe UI, Arial" font-size="13" font-weight="600">Raw</text><text x="94" y="502" fill="#6d7b89" font-family="Segoe UI, Arial" font-size="13">JWT</text>
