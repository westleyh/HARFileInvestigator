<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
  <title id="title">Request and response inspection mockup</title>
  <desc id="desc">Illustrative detail panel with request Raw, JWT, and JavaScript Stack tabs and a response body.</desc>
  <rect width="1100" height="640" fill="#e9edf2"/>
  <rect x="0" y="0" width="1100" height="42" fill="#26384a"/>
