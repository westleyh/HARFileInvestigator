  <rect x="18" y="58" width="1064" height="330" rx="5" fill="#fff" stroke="#c6d0da"/>
  <text x="38" y="86" fill="#26384a" font-family="Segoe UI, Arial" font-size="16" font-weight="600">Request</text>
