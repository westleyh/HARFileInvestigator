<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">HAR File Investigator main window mockup</title>
  <desc id="desc">Illustrative mockup showing the query toolbar, HAR entry grid, and request and response inspection panes.</desc>
  <rect width="1280" height="720" fill="#e9edf2"/>
  <rect x="0" y="0" width="1280" height="42" fill="#26384a"/>
  <text x="18" y="27" fill="#ffffff" font-family="Segoe UI, Arial" font-size="17" font-weight="600">HAR File Investigator</text>
  <text x="1215" y="27" fill="#d4dde6" font-family="Segoe UI, Arial" font-size="12" text-anchor="end">ILLUSTRATIVE MOCKUP</text>
  <rect x="14" y="54" width="1252" height="84" rx="5" fill="#ffffff" stroke="#c6d0da"/>
  <rect x="28" y="69" width="126" height="34" rx="4" fill="#286da8"/>
  <text x="91" y="91" fill="#fff" font-family="Segoe UI, Arial" font-size="13" text-anchor="middle">Open HAR...</text>
  <rect x="165" y="69" width="150" height="34" rx="4" fill="#f5f7f9" stroke="#b8c3cd"/>
  <text x="240" y="91" fill="#364554" font-family="Segoe UI, Arial" font-size="13" text-anchor="middle">Export CSV...</text>
  <rect x="328" y="69" width="112" height="34" rx="4" fill="#f5f7f9" stroke="#b8c3cd"/>
  <text x="384" y="91" fill="#364554" font-family="Segoe UI, Arial" font-size="13" text-anchor="middle">Timeline</text>
  <text x="464" y="91" fill="#364554" font-family="Segoe UI, Arial" font-size="13">Query:</text>
  <rect x="516" y="69" width="500" height="34" rx="3" fill="#fff" stroke="#aebbc7"/>
  <text x="528" y="91" fill="#405364" font-family="Consolas, monospace" font-size="13">status&gt;=400 AND host:api.example.com</text>
  <rect x="1027" y="69" width="82" height="34" rx="4" fill="#286da8"/>
  <text x="1068" y="91" fill="#fff" font-family="Segoe UI, Arial" font-size="13" text-anchor="middle">Apply</text>
  <rect x="1118" y="69" width="76" height="34" rx="4" fill="#f5f7f9" stroke="#b8c3cd"/>
  <text x="1156" y="91" fill="#364554" font-family="Segoe UI, Arial" font-size="13" text-anchor="middle">Filter On</text>
  <rect x="1203" y="69" width="48" height="34" rx="4" fill="#f5f7f9" stroke="#b8c3cd"/>
  <text x="1227" y="91" fill="#364554" font-family="Segoe UI, Arial" font-size="12" text-anchor="middle">Dark</text>
  <rect x="14" y="150" width="775" height="536" rx="4" fill="#fff" stroke="#c6d0da"/>
  <text x="30" y="176" fill="#26384a" font-family="Segoe UI, Arial" font-size="15" font-weight="600">Sessions</text>
  <rect x="26" y="190" width="750" height="31" fill="#e8eef4"/>
  <text x="36" y="210" fill="#35495d" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Started</text>
  <text x="174" y="210" fill="#35495d" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Method</text>
  <text x="250" y="210" fill="#35495d" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Host</text>
  <text x="430" y="210" fill="#35495d" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Status</text>
  <text x="515" y="210" fill="#35495d" font-family="Segoe UI, Arial" font-size="12" font-weight="600">MIME</text>
  <text x="665" y="210" fill="#35495d" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Time</text>
  <g font-family="Consolas, monospace" font-size="11" fill="#354554">
	<rect x="26" y="222" width="750" height="35" fill="#fff"/><text x="36" y="244">10:42:18.215</text><text x="174" y="244">GET</text><text x="250" y="244">api.example.com</text><text x="430" y="244">200</text><text x="515" y="244">application/json</text><text x="665" y="244">84.2 ms</text>
	<rect x="26" y="257" width="750" height="35" fill="#fff7ba"/><text x="36" y="279">10:42:18.491</text><text x="174" y="279">POST</text><text x="250" y="279">api.example.com</text><text x="430" y="279">401</text><text x="515" y="279">application/json</text><text x="665" y="279">31.7 ms</text>
	<rect x="26" y="292" width="750" height="35" fill="#fff"/><text x="36" y="314">10:42:19.002</text><text x="174" y="314">GET</text><text x="250" y="314">cdn.example.com</text><text x="430" y="314">200</text><text x="515" y="314">text/javascript</text><text x="665" y="314">12.8 ms</text>
	<rect x="26" y="327" width="750" height="35" fill="#fff"/><text x="36" y="349">10:42:19.511</text><text x="174" y="349">PUT</text><text x="250" y="349">api.example.com</text><text x="430" y="349">503</text><text x="515" y="349">application/json</text><text x="665" y="349">923.4 ms</text>
  </g>
  <path d="M26 362H776M26 397H776M26 432H776M26 467H776M26 502H776M26 537H776M26 572H776M26 607H776M26 642H776" stroke="#e7ebef"/>
  <rect x="802" y="150" width="464" height="262" rx="4" fill="#fff" stroke="#c6d0da"/>
  <text x="820" y="176" fill="#26384a" font-family="Segoe UI, Arial" font-size="15" font-weight="600">Request</text>
  <rect x="817" y="186" width="434" height="37" fill="#f1f4f7"/>
  <text x="829" y="210" fill="#34495e" font-family="Segoe UI, Arial" font-size="12">Search request</text><text x="990" y="210" fill="#34495e" font-family="Segoe UI, Arial" font-size="12">⌃</text><text x="1025" y="210" fill="#34495e" font-family="Segoe UI, Arial" font-size="12">Search</text><text x="1081" y="210" fill="#34495e" font-family="Segoe UI, Arial" font-size="12">⌄</text>
  <rect x="817" y="227" width="434" height="31" fill="#fff"/>
  <text x="831" y="248" fill="#286da8" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Raw</text><text x="875" y="248" fill="#6b7885" font-family="Segoe UI, Arial" font-size="12">JWT</text><text x="915" y="248" fill="#6b7885" font-family="Segoe UI, Arial" font-size="12">JavaScript Stack</text>
  <rect x="817" y="258" width="434" height="140" fill="#fbfcfd"/>
  <g fill="#314456" font-family="Consolas, monospace" font-size="11"><text x="831" y="281">POST https://api.example.com/auth HTTP/2</text><text x="831" y="310">Request Headers:</text><text x="831" y="329">  Content-Type: application/json</text><text x="831" y="348">  Authorization: Bearer ...</text><text x="831" y="378">Request Body: {"user":"demo"}</text></g>
  <rect x="802" y="424" width="464" height="262" rx="4" fill="#fff" stroke="#c6d0da"/>
  <text x="820" y="450" fill="#26384a" font-family="Segoe UI, Arial" font-size="15" font-weight="600">Response</text>
  <rect x="817" y="460" width="434" height="37" fill="#f1f4f7"/>
  <text x="829" y="484" fill="#34495e" font-family="Segoe UI, Arial" font-size="12">Search response</text><text x="990" y="484" fill="#34495e" font-family="Segoe UI, Arial" font-size="12">⌃</text><text x="1025" y="484" fill="#34495e" font-size="12" font-family="Segoe UI, Arial">Search</text><text x="1081" y="484" fill="#34495e" font-family="Segoe UI, Arial" font-size="12">⌄</text>
  <rect x="817" y="501" width="434" height="31" fill="#fff"/>
  <text x="831" y="522" fill="#286da8" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Raw</text><text x="875" y="522" fill="#6b7885" font-family="Segoe UI, Arial" font-size="12">JWT</text>
  <rect x="817" y="532" width="434" height="140" fill="#fbfcfd"/>
  <g fill="#314456" font-family="Consolas, monospace" font-size="11"><text x="831" y="555">HTTP/2 401 Unauthorized</text><text x="831" y="584">Response Headers:</text><text x="831" y="603">  Content-Type: application/json</text><text x="831" y="632">Response Body:</text><text x="831" y="651">  {"error":"token expired"}</text></g>
</svg>
